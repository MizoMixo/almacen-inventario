<h1 class="text-2xl font-bold text-[#16304f]">Registrar transferencias</h1>
<p class="text-sm text-slate-600">
  Gestiona el traslado de materiales entre los almacenes de la empresa.
</p>

<div class="flex flex-wrap gap-3 mt-4 mb-4">
  <a
    routerLink="/transferencias/nueva"
    class="flex items-center gap-2 bg-[#446c96] hover:bg-[#3a5f86] text-white text-xs font-semibold rounded-lg px-5 py-2.5 shadow"
  >
    <svg lucideArrowLeftRight [size]="16"></svg>
    Nueva transferencia
  </a>
  <a
    routerLink="/stock"
    class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-lg px-5 py-2.5 shadow"
  >
    <svg lucideBoxes [size]="16"></svg>
    Ver stock por almacén
  </a>
</div>

<section class="bg-white rounded-2xl shadow-md p-6">
  <h2 class="text-xl font-bold mb-4">Últimas transferencias</h2>

  @for (o of transferencias; track o.id) {
    <app-fila-operacion [operacion]="o" (detalle)="seleccionada.set($event)" />
  } @empty {
    <p class="text-sm text-slate-500">Todavía no hay transferencias registradas.</p>
  }
</section>

@if (seleccionada(); as op) {
  <app-detalle-operacion [operacion]="op" (cerrar)="seleccionada.set(null)" />
}
