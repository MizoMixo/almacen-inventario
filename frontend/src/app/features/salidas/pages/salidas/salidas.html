<h1 class="text-2xl font-bold text-[#16304f]">Registrar salidas</h1>
<p class="text-sm text-slate-600">Comienza una nueva entrega de materiales.</p>

<a
  routerLink="/salidas/nueva"
  class="inline-block mt-4 mb-4 bg-[#446c96] hover:bg-[#3a5f86] text-white text-xs font-semibold rounded-lg px-5 py-2.5 shadow"
>
  Registrar salida
</a>

<section class="bg-white rounded-2xl shadow-md p-6">
  <h2 class="text-xl font-bold mb-4">Últimas salidas</h2>

  @for (o of salidas; track o.id) {
    <app-fila-operacion [operacion]="o" (detalle)="seleccionada.set($event)" />
  } @empty {
    <p class="text-sm text-slate-500">Todavía no hay salidas registradas.</p>
  }
</section>

@if (seleccionada(); as op) {
  <app-detalle-operacion [operacion]="op" (cerrar)="seleccionada.set(null)" />
}
