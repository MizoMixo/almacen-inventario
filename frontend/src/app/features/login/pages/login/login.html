<div class="min-h-screen bg-slate-300 flex items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-xl bg-white shadow-lg overflow-hidden">
    <div class="bg-[#16304f] text-white px-6 py-6 flex flex-col items-center gap-2">
      <svg lucideWarehouse [size]="40"></svg>
      <h1 class="text-xl">Sistema almacén VCM</h1>
      <p class="text-sm text-slate-300">Inicia sesión para continuar</p>
    </div>

    <form class="p-6 space-y-4" (ngSubmit)="entrar()">
      <div>
        <label for="usuario" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          autocomplete="username"
          [(ngModel)]="usuario"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#446c96]"
        />
      </div>

      <div>
        <label for="clave" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          id="clave"
          name="clave"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="clave"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#446c96]"
        />
      </div>

      @if (error()) {
        <p class="rounded-lg border border-rose-300 bg-rose-50 px-3 py-2 text-sm text-rose-700">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="enviando()"
        class="w-full rounded-lg bg-[#16304f] py-2.5 text-white hover:bg-[#446c96] disabled:opacity-60"
      >
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
