<div class="flex flex-col items-end gap-2">
  @if (!guardado()) {
    @if (error()) {
      <p class="text-sm text-rose-600">{{ error() }}</p>
    }
    <div class="flex items-center gap-3">
      <a [routerLink]="rutaVolver()" class="text-sm font-semibold text-slate-600 hover:underline"
        >Cancelar</a
      >
      <button
        type="button"
        (click)="guardar.emit()"
        class="bg-[#446c96] hover:bg-[#3a5f86] text-white text-sm font-semibold rounded-lg px-5 py-2.5 shadow"
      >
        {{ textoGuardar() }}
      </button>
    </div>
  } @else {
    <div class="flex items-center gap-3">
      <a [routerLink]="rutaVolver()" class="text-sm font-semibold text-slate-600 hover:underline">{{
        textoVolver()
      }}</a>
      <button
        type="button"
        (click)="nuevo.emit()"
        class="bg-[#446c96] hover:bg-[#3a5f86] text-white text-sm font-semibold rounded-lg px-5 py-2.5 shadow"
      >
        {{ textoNuevo() }}
      </button>
    </div>
  }
</div>
