<div class="flex items-start justify-between gap-4 mb-4">
  <div id="titulo-formulario">
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="text-2xl font-bold text-[#16304f]">{{ titulo() }}</h1>
      <ng-content />
    </div>
    <p class="text-sm text-slate-600">{{ subtitulo() }}</p>

    @if (guardado()) {
      <div
        id="mensaje-guardado"
        class="mt-3 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-800 text-sm font-medium px-3 py-2"
      >
        {{ mensajeGuardado() }}
      </div>
    }
  </div>

  <span
    [class]="
      'text-xs font-semibold rounded-full px-3 py-1 shrink-0 ' +
      (guardado() ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800')
    "
  >
    {{ guardado() ? etiquetaGuardado() : 'Borrador' }}
  </span>
</div>
